# ============================================================
# WZY Linux — GRUB 引导配置（BIOS + UEFI 共用）
# 视觉取自 wzylinux design tokens（深色玻璃拟态 + 极光渐变）
# ============================================================

set default="0"
set timeout=10
set timeout_style=menu

insmod all_video
insmod gfxterm
insmod png
insmod gfxterm_background

# 终端与菜单配色（品牌色）
set gfxmode=auto
terminal_output gfxterm

# 自动定位包含系统文件的设备（兼容 Rufus 提取 / DD / 虚拟机各种布局）
search --no-floppy --file /casper/vmlinuz --set=root
# 加载 Unicode 字体（含中文），解决菜单中文乱码
insmod font
loadfont /boot/grub/fonts/unicode.pf2
set lang=zh_CN

# 加载主题（含背景渐变 + 圆角玻璃风菜单）
set theme=/boot/grub/theme/theme.txt

menuentry "WZY Linux  (Live)" {
    linux /casper/vmlinuz boot=casper quiet splash ---
    initrd /casper/initrd
}

menuentry "WZY Linux  (Live · 安全图形模式)" {
    linux /casper/vmlinuz boot=casper xforcevesa nomodeset ---
    initrd /casper/initrd
}

menuentry "WZY Linux  (救援 / 单用户)" {
    linux /casper/vmlinuz boot=casper single ---
    initrd /casper/initrd
}

menuentry "从第一块硬盘启动 (UEFI)" {
    search --no-floppy --file --set=root /EFI/BOOT/BOOTX64.EFI
    chainloader (${root})/EFI/BOOT/BOOTX64.EFI
}

menuentry "重启" { reboot }
menuentry "关机" { halt }
